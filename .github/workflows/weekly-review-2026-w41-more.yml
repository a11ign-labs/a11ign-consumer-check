# The weekly outsider review 2026-W41 (a11ign/a11ign#3612), second pass: the same Quickstart job over three more
# pages we do not own, because the first (Wikipedia's Main Page) failed in the scorer. Started by hand; no secrets.
name: a11ign-more

on:
  workflow_dispatch:

jobs:
  a11ign:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wikipedia-article
            url: https://en.wikipedia.org/wiki/Screen_reader
            task: Find the list of screen readers
          - name: python-org
            url: https://www.python.org/
            task: Find the downloads page
          - name: sqlite-docs
            url: https://www.sqlite.org/docs.html
            task: Find the SQL syntax documentation
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: a11ign/a11ign@v0.1.0
        id: a11ign
        with:
          url: ${{ matrix.url }}
          task: ${{ matrix.task }}
      - uses: actions/upload-artifact@v7
        if: always() && steps.a11ign.outputs.result-json != ''
        with:
          name: a11ign-result-${{ matrix.name }}
          path: ${{ steps.a11ign.outputs.result-json }}
          if-no-files-found: warn
