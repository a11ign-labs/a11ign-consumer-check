# The weekly outsider review 2026-W41 (a11ign/a11ign#3612): the Quickstart's job, copied as README.md gives it,
# with the one change the docs ask for (url and task). Started by hand; no secrets.
name: a11ign

on:
  workflow_dispatch:

jobs:
  a11ign:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: a11ign/a11ign@v0.1.0
        id: a11ign
        with:
          url: https://en.wikipedia.org/wiki/Main_Page
          task: Search for an article about screen readers
      - uses: actions/upload-artifact@v7
        if: always() && steps.a11ign.outputs.result-json != ''
        with:
          name: a11ign-result
          path: ${{ steps.a11ign.outputs.result-json }}
          if-no-files-found: warn
