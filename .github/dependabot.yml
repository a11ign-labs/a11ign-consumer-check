# The pin refresh is Dependabot, not a stored token: a workflow cannot commit a change under
# .github/workflows with its own GITHUB_TOKEN, and this repository holds no secret of any kind.
#
# It refreshes ONE dependency. The workflow is generated by a11ign/a11ign (scripts/outsider/generate.mjs) and must stay
# byte-identical to it except the pin line, so every other action is bumped THERE and regenerated here, never by a PR here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "a11ign/a11ign"
